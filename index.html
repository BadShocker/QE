<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25688f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EmotionQuest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png" type="image/png">
<title>EmotionQuest</title>
<style>
:root{
  --bg:#f2f5f7; --surface:#ffffff; --fg:#16212a; --muted:#5b6a77; --line:#d9e0e6;
  --int:#25688f; --int-soft:#dcecf5; --freq:#a85d00; --freq-soft:#f8e8d0; --on:#eef6fa; --danger:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11181e; --surface:#192229; --fg:#e5ebf0; --muted:#93a3b0; --line:#2a3640;
  --int:#74b6dd; --int-soft:#1f3a4b; --freq:#e8a550; --freq-soft:#40301a; --on:#1c2b35; --danger:#f0857d;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:900px;margin:0 auto;padding-right:30px}
h1{font-size:26px;line-height:1.1;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);margin:6px 0 14px;font-size:13px;max-width:62ch}
input,textarea,button{font:inherit;color:inherit}
input[type=date],input[type=search],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
:focus-visible{outline:2px solid var(--int);outline-offset:2px}
.head2{display:flex;gap:8px;margin-bottom:10px}
.head2 #date{flex:none}.head2 #note{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;margin:0 0 12px}
.legend b{font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.d-int{background:var(--int)}.d-freq{background:var(--freq)}

#dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:8px 0;margin-bottom:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.tabs{display:flex;gap:8px}
.tab{all:unset;box-sizing:border-box;flex:1 1 auto;display:flex;gap:7px;align-items:center;justify-content:center;cursor:pointer;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-expanded="true"]{background:var(--int-soft);border-color:var(--int);color:var(--int)}
.tab:focus-visible{outline:2px solid var(--int);outline-offset:2px}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--int);color:var(--surface);font-size:12px;line-height:20px;text-align:center}
.panel{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:38vh;overflow-y:auto}
.panel input[type=search]{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cnt{color:var(--muted);font-size:12px}
.linkbtn{all:unset;cursor:pointer;color:var(--int);font-weight:600;font-size:13px;text-decoration:underline;margin-left:4px}
.linkbtn:focus-visible{outline:2px solid var(--int);outline-offset:2px}
.fmt{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.fmt button{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 11px;font-weight:600;font-size:13px;color:var(--muted)}
.fmt button+button{border-left:1px solid var(--line)}
.fmt button[aria-pressed="true"]{background:var(--int-soft);color:var(--int)}
.fmt button:focus-visible{outline:2px solid var(--int);outline-offset:-2px}
.undo{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:var(--fg);color:var(--bg);padding:8px 8px 8px 14px;border-radius:10px;z-index:30;max-width:92vw;white-space:nowrap}
.undo button{all:unset;cursor:pointer;font-weight:700;padding:7px 12px;border-radius:7px;border:1px solid currentColor}
.undo button:focus-visible{outline:2px solid var(--bg);outline-offset:2px}
.muted{color:var(--muted);font-size:13px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:4px 9px;border-radius:999px;background:var(--on);border:1px solid var(--line);font-size:13px}
.chip:focus-visible{outline:2px solid var(--int)}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;
  min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);scroll-margin-top:12px;min-width:0}
.row .name{overflow-wrap:anywhere}
.row.on{background:var(--on);border-color:var(--int)}
.row:focus-visible{outline:2px solid var(--int);outline-offset:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tags:empty{display:none}
.t{font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px}
.t-i{background:var(--int-soft);color:var(--int)}
.t-f{background:var(--freq-soft);color:var(--freq)}
.empty{color:var(--muted);padding:18px 8px}

#az{position:fixed;right:max(2px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;z-index:4;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 0;max-height:70vh;overflow:hidden}
#az button{all:unset;box-sizing:border-box;cursor:pointer;width:26px;height:min(26px,4.4vh);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--int)}
#az button:focus-visible{outline:2px solid var(--int);outline-offset:-2px}

h2.sec{font-size:17px;margin:22px 0 8px}
textarea{width:100%;min-height:92px;resize:vertical}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 16px;border-radius:8px;font-weight:600;background:var(--int);color:var(--surface);text-align:center}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:10px;align-items:center;z-index:5}
.bar .st{all:unset;box-sizing:border-box;flex:1;min-width:0;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .st:focus-visible{outline:2px solid var(--int)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}

#sw{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));outline:none}
.sheet h3{margin:0 0 14px;font-size:20px}
.grp{margin-bottom:14px}
.gl{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.lab{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:700;font-size:13px}
.lab-i{background:var(--int-soft);color:var(--int)}
.lab-f{background:var(--freq-soft);color:var(--freq)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;padding:4px}
.opts b{font-size:20px;line-height:1}
.opts small{font-size:12px;color:var(--muted)}
.opts[data-k="i"] button[aria-pressed="true"]{background:var(--int);border-color:var(--int);color:var(--surface)}
.opts[data-k="f"] button[aria-pressed="true"]{background:var(--freq);border-color:var(--freq);color:var(--surface)}
.opts button[aria-pressed="true"] small{color:inherit}
.opts button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.shbar{display:flex;gap:10px;justify-content:flex-end}
@keyframes up{from{transform:translateY(36px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
@keyframes pop{40%{transform:scale(1.06)}}
#sw:not([hidden]){animation:fade .18s ease-out}
#sw:not([hidden]) .sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)}
.panel:not([hidden]){animation:drop .16s ease-out}
.row.pop{animation:pop .42s ease-out}
.fly{position:fixed;left:0;top:0;z-index:40;pointer-events:none;padding:6px 14px;border-radius:999px;background:var(--int);color:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}#sw,#sw .sheet,.panel,.row.pop{animation:none!important}}
@media (max-width:420px){.bar .btn{padding:10px 11px}.bar{gap:8px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>EmotionQuest</h1>
  <p class="sub">Scheda 1: emozioni, sentimenti e stati d'animo relativi a «questo periodo di vita».</p>

  <div class="head2">
    <input type="date" id="date" aria-label="Data">
    <input type="text" id="note" maxlength="120" autocomplete="off" placeholder="Nota sulla giornata" aria-label="Nota sulla giornata">
  </div>
  <p class="legend">
    <span><i class="dot d-int"></i><b>I</b> = Intensità</span>
    <span><i class="dot d-freq"></i><b>F</b> = Frequenza</span>
    <span>+ poco · ++ medio · +++ molto</span>
  </p>

  <div id="dock">
    <div class="tabs" role="group" aria-label="Pannelli">
      <button type="button" class="tab" data-p="freq" aria-expanded="false" aria-controls="freq">Frequenti</button>
      <button type="button" class="tab" id="tabSel" data-p="summary" aria-expanded="false" aria-controls="summary">Selezionate <span class="badge" id="sumCount">0</span></button>
      <button type="button" class="tab" data-p="searchBox" aria-expanded="false" aria-controls="searchBox">Cerca</button>
    </div>
    <section id="freq" class="panel" aria-label="Emozioni più frequenti" hidden><div class="chips" id="freqChips"></div></section>
    <section id="summary" class="panel" aria-label="Emozioni selezionate" hidden><div class="chips" id="chips"></div></section>
    <div id="searchBox" class="panel" hidden><input type="search" id="q" placeholder="Cerca un'emozione" aria-label="Cerca un'emozione"></div>
  </div>

  <div class="list" id="list"></div>
  <p class="empty" id="none" hidden>Nessuna emozione corrisponde alla ricerca.</p>
</div>

<nav id="az" aria-label="Vai alla lettera"></nav>

<div class="bar">
  <button class="st" id="st" type="button"></button>
  <div class="fmt" role="group" aria-label="Formato del file">
    <button type="button" data-f="pdf" aria-pressed="true">PDF</button>
    <button type="button" data-f="txt" aria-pressed="false">TXT</button>
  </div>
  <button class="btn" id="save" type="button">Salva</button>
</div>

<div id="sw" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shName" tabindex="-1">
    <h3 id="shName"></h3>
    <div class="grp"><div class="gl"><span class="lab lab-i">I</span> Intensità</div><div class="opts" data-k="i" id="optI"></div></div>
    <div class="grp"><div class="gl"><span class="lab lab-f">F</span> Frequenza</div><div class="opts" data-k="f" id="optF"></div></div>
    <div class="shbar"><button class="btn sec" id="shClear" type="button">Rimuovi</button><button class="btn" id="shDone" type="button">Fatto</button></div>
  </div>
</div>
<div class="undo" id="undo" hidden role="status"><span>Questionario azzerato</span><button id="undoBtn" type="button">Annulla</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
function latin(s){return String(s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/[^\x20-\xFF]/g,"?")}
function pdfEsc(s){return latin(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
function wrapText(text,max){
  const out=[];
  String(text).split(/\r?\n/).forEach(par=>{
    let line="";
    par.split(/\s+/).forEach(w=>{
      if(!w)return;
      while(w.length>max){if(line){out.push(line);line=""}out.push(w.slice(0,max));w=w.slice(max)}
      if((line?line+" "+w:w).length>max){out.push(line);line=w}else line=line?line+" "+w:w;
    });
    out.push(line);
  });
  return out;
}
function buildPdf(d){
  const H=842,M=56,R=539,pages=[];
  let ops=[],y=0;
  const newPage=()=>{ops=[];pages.push(ops);y=H-M};
  const text=(x,s,size,bold)=>ops.push(`BT /${bold?"F2":"F1"} ${size} Tf ${x} ${y} Td (${pdfEsc(s)}) Tj ET`);
  const rule=()=>ops.push(`0.5 w ${M} ${y} m ${R} ${y} l S`);
  newPage();
  text(M,d.title,16,true);y-=20;
  text(M,d.subtitle,9,false);y-=22;
  text(M,"Data: "+d.date,12,true);y-=(d.note?18:26);
  if(d.note){wrapText("Nota: "+d.note,85).forEach(l=>{text(M,l,11,false);y-=15});y-=11}
  const head=()=>{text(M,"Emozione",10,true);text(330,"Intensità (I)",10,true);text(435,"Frequenza (F)",10,true);y-=6;rule();y-=16};
  head();
  d.rows.forEach(r=>{if(y<M){newPage();head()}text(M,r[0],11,false);text(330,r[1]||"-",11,false);text(435,r[2]||"-",11,false);y-=17});
  let out="%PDF-1.4\n";const offs=[];
  const add=(id,body)=>{offs[id]=out.length;out+=`${id} 0 obj\n${body}\nendobj\n`};
  const n=pages.length;
  add(1,"<< /Type /Catalog /Pages 2 0 R >>");
  add(2,`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>`${5+2*i} 0 R`).join(" ")}] >>`);
  add(3,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  add(4,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  pages.forEach((p,i)=>{
    const s=p.join("\n");
    add(5+2*i,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+2*i} 0 R >>`);
    add(6+2*i,`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);
  });
  const size=5+2*n,xref=out.length;
  out+=`xref\n0 ${size}\n0000000000 65535 f \n`;
  for(let i=1;i<size;i++)out+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  out+=`trailer\n<< /Size ${size} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const u=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return u;
}


</script>
<script>
const EMOZIONI=["Accettazione","Adorazione","Affetto","Agitazione","Aggressività","Agonismo","Allegria","Ammirazione","Amore","Angoscia","Ansia","Apatia","Apprensione","Aspettativa","Collera","Commozione","Compassione","Concitazione","Confusione","Contentezza","Curiosità","Debolezza","Dedizione","Delusione","Determinazione","Devozione","Diffidenza","Disagio","Disgusto","Disperazione","Disprezzo","Dolore","Eccitazione","Entusiasmo","Estraneità","Estasi","Esultanza","Euforia","Fastidio","Felicità","Fiducia","Fratellanza","Frustrazione","Furia","Gelosia","Gioia","Gratitudine","Imbarazzo","Impotenza","Inadeguatezza","Incoerenza","Indolenza","Indifferenza","Inquietudine","Insofferenza","Invidia","Ira","Irrequietezza","Irritazione","Malinconia","Noia","Nostalgia","Odio","Onnipotenza","Orrore","Ottimismo","Panico","Paura","Pensosità","Perplessità","Pietà","Preoccupazione","Prostrazione","Pudore","Rabbia","Rassegnazione","Repulsione","Rimorso","Rimpianto","Sbalordimento","Schifo","Sconforto","Senso di colpa","Serenità","Solidarietà","Sollievo","Sorpresa","Sottomissione","Spavento","Speranza","Spossatezza","Stupore","Superiorità","Terrore","Tenerezza","Timidezza","Tranquillità","Tristezza","Tolleranza","Vergogna","Vigilanza","Vulnerabilità"];
const W={"":0,"+":1,"++":2,"+++":3};
const CAP={i:["poco","medio","molto"],f:["poco","medio","molto"]};
const $=id=>document.getElementById(id);
const DRAFT="treq_bozza_v1";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=iso=>{try{return new Date(iso+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return iso}};
let values={},rowMap={},openName=null,openSrc=null;
const UNDO="treq_annulla_v1";
let undoSnap=null,undoTimer=null;
try{undoSnap=JSON.parse(localStorage.getItem(UNDO))}catch(e){}
function setUndo(s){undoSnap=s;try{s?localStorage.setItem(UNDO,JSON.stringify(s)):localStorage.removeItem(UNDO)}catch(e){}}
function hideUndoBar(){$("undo").hidden=true;clearTimeout(undoTimer)}
function clearUndo(){if(!undoSnap&&$("undo").hidden)return;setUndo(null);hideUndoBar();renderSummary()}
function showUndoBar(){$("undo").hidden=false;clearTimeout(undoTimer);undoTimer=setTimeout(hideUndoBar,12000)}
function doUndo(){
  if(!undoSnap)return;
  const s=undoSnap;
  values=s.values&&typeof s.values==="object"?s.values:{};
  Object.keys(values).forEach(k=>{if(!rowMap[k])delete values[k]});
  $("date").value=s.date||today();prevDate=$("date").value;$("note").value=s.note||"";
  setUndo(null);hideUndoBar();
  Object.keys(rowMap).forEach(paintRow);refresh();saveDraft();toast("Compilazione ripristinata");
}

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
function armed(btn,label,fn){
  if(btn.dataset.armed){clearTimeout(btn._t);btn.textContent=btn.dataset.orig;delete btn.dataset.armed;fn();return}
  btn.dataset.orig=btn.textContent;btn.dataset.armed="1";btn.textContent=label;
  btn._t=setTimeout(()=>{btn.textContent=btn.dataset.orig;delete btn.dataset.armed},3000);
}
function tagsHtml(v){return (v&&v.i?`<span class="t t-i">I${v.i}</span>`:"")+(v&&v.f?`<span class="t t-f">F${v.f}</span>`:"")}

/* ---------- elenco ---------- */
function buildList(){
  $("list").innerHTML=EMOZIONI.map(e=>`<button type="button" class="row" data-name="${e}" data-letter="${e[0].toUpperCase()}"><span class="name">${e}</span><span class="tags"></span></button>`).join("");
  document.querySelectorAll("#list .row").forEach(r=>{rowMap[r.dataset.name]=r});
  $("list").addEventListener("click",ev=>{const r=ev.target.closest(".row");if(r)openSheet(r.dataset.name,r)});
  const letters=[...new Set(EMOZIONI.map(e=>e[0].toUpperCase()))];
  $("az").innerHTML=letters.map(l=>`<button type="button" data-l="${l}" aria-label="Vai alla lettera ${l}">${l}</button>`).join("");
  $("az").addEventListener("click",ev=>{
    const b=ev.target.closest("button");if(!b)return;
    const r=[...document.querySelectorAll("#list .row")].find(x=>x.dataset.letter===b.dataset.l&&!x.hidden);
    if(r)window.scrollTo({top:r.getBoundingClientRect().top+scrollY-$("dock").offsetHeight-14,behavior:"smooth"});else toast("Nessuna emozione con la "+b.dataset.l+" nei risultati");
  });
}
function paintRow(name){
  const r=rowMap[name],v=values[name];
  r.classList.toggle("on",!!v);r.querySelector(".tags").innerHTML=tagsHtml(v);
}

/* storico delle compilazioni salvate (solo nomi, per le più frequenti) */
const HIST="treq_storico_v1";
function loadHist(){try{return JSON.parse(localStorage.getItem(HIST))||{}}catch(e){return{}}}
function recordHistory(){
  const h=loadHist();h[$("date").value||today()]=Object.keys(values);
  try{localStorage.setItem(HIST,JSON.stringify(h))}catch(e){}
  renderFreq();
}
function renderFreq(){
  const c={};
  Object.values(loadHist()).forEach(a=>{if(Array.isArray(a))a.forEach(n=>{if(EMOZIONI.includes(n))c[n]=(c[n]||0)+1})});
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"it")).slice(0,8);
  const box=$("freqChips");box.textContent="";
  if(!top.length){const s=document.createElement("span");s.className="muted";s.textContent="Qui compariranno le emozioni che scegli più spesso, dopo il primo salvataggio (PDF o TXT).";box.appendChild(s);return}
  top.forEach(([n,k])=>{
    const b=document.createElement("button");b.type="button";b.className="chip";
    const t=document.createElement("span");t.textContent=n;b.appendChild(t);
    const q=document.createElement("span");q.className="cnt";q.textContent=k+(k===1?" volta":" volte");b.appendChild(q);
    b.onclick=()=>openSheet(n,b);box.appendChild(b);
  });
}

function renderSummary(){
  const names=EMOZIONI.filter(n=>values[n]);
  $("sumCount").textContent=names.length;
  const box=$("chips");box.textContent="";
  if(!names.length){const s=document.createElement("span");s.className="muted";s.textContent="Tocca un'emozione nell'elenco per segnarla.";box.appendChild(s);
    if(undoSnap&&(Object.keys(undoSnap.values||{}).length||(undoSnap.note||"").trim())){const b=document.createElement("button");b.type="button";b.className="linkbtn";b.textContent="Ripristina la compilazione azzerata";b.onclick=doUndo;box.appendChild(b)}
    return}
  names.forEach(n=>{
    const b=document.createElement("button");b.type="button";b.className="chip";
    const t=document.createElement("span");t.textContent=n;b.appendChild(t);
    const g=document.createElement("span");g.className="tags";g.innerHTML=tagsHtml(values[n]);b.appendChild(g);
    b.onclick=()=>openSheet(n,b);box.appendChild(b);
  });
}
function refresh(){
  const n=Object.keys(values).length;
  $("st").textContent=n?n+(n===1?" selezionata":" selezionate"):"0 selezionate";
  const q=$("q").value.trim().toLowerCase();let shown=0;
  Object.entries(rowMap).forEach(([name,r])=>{const h=!!q&&!name.toLowerCase().includes(q);r.hidden=h;if(!h)shown++});
  $("none").hidden=shown>0;
  renderSummary();
}

/* ---------- riquadro intensità / frequenza ---------- */
function buildSheet(){
  ["i","f"].forEach(k=>{
    $(k==="i"?"optI":"optF").innerHTML=["+","++","+++"].map((v,j)=>`<button type="button" data-v="${v}" aria-pressed="false" aria-label="${k==="i"?"Intensità":"Frequenza"} ${v}"><b>${v}</b><small>${CAP[k][j]}</small></button>`).join("");
  });
  ["optI","optF"].forEach(id=>$(id).addEventListener("click",ev=>{
    const b=ev.target.closest("button[data-v]");if(!b||!openName)return;
    const k=$(id).dataset.k,v=values[openName]||(values[openName]={i:"",f:""});
    v[k]=v[k]===b.dataset.v?"":b.dataset.v;
    if(!v.i&&!v.f)delete values[openName];
    clearUndo();paintRow(openName);refresh();syncSheet();saveDraft();
  }));
  $("shDone").onclick=()=>closeSheet(true);
  $("shClear").onclick=()=>{if(openName){clearUndo();delete values[openName];paintRow(openName);refresh();syncSheet();saveDraft()}closeSheet()};
  $("sw").addEventListener("click",ev=>{if(ev.target===$("sw"))closeSheet()});
  addEventListener("keydown",ev=>{if(ev.key==="Escape"&&openName)closeSheet()});
}
function syncSheet(){
  const v=(openName&&values[openName])||{i:"",f:""};
  ["i","f"].forEach(k=>$(k==="i"?"optI":"optF").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(v[k]===b.dataset.v))));
}
function openSheet(name,src){
  openName=name;openSrc=src||null;$("shName").textContent=name;syncSheet();$("sw").hidden=false;$("sheet").focus();
}
function closeSheet(done){
  const n=openName,src=openSrc;openName=null;openSrc=null;$("sw").hidden=true;
  if(n&&rowMap[n])try{rowMap[n].focus({preventScroll:true})}catch(e){}
  if(done&&n&&values[n])celebrate(n,src);
}
/* animazione al "Fatto": l'emozione vola verso "Selezionate" */
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function celebrate(name,src){
  if(reduceMotion())return;
  const r=rowMap[name];
  if(r){r.classList.remove("pop");void r.offsetWidth;r.classList.add("pop")}
  const visible=el=>{if(!el||!document.contains(el))return null;const q=el.getBoundingClientRect();return q.width>0&&q.bottom>0&&q.top<innerHeight?q:null};
  const from=visible(src)||visible(r)||{left:innerWidth/2,top:innerHeight*0.7,width:0,height:0};
  const to=$("tabSel").getBoundingClientRect();
  const el=document.createElement("div");el.className="fly";el.textContent=name;document.body.appendChild(el);
  const w=el.offsetWidth,h=el.offsetHeight;
  const sx=from.left+from.width/2-w/2,sy=from.top+from.height/2-h/2;
  const tx=to.left+to.width/2-w/2,ty=to.top+to.height/2-h/2;
  const a=el.animate([{transform:`translate(${sx}px,${sy}px) scale(1)`,opacity:1},{transform:`translate(${tx}px,${ty}px) scale(.3)`,opacity:.15}],{duration:560,easing:"cubic-bezier(.45,0,.2,1)"});
  a.onfinish=()=>{el.remove();$("sumCount").animate([{transform:"scale(1)"},{transform:"scale(1.7)"},{transform:"scale(1)"}],{duration:340,easing:"ease-out"})};
  a.oncancel=()=>el.remove();
}

/* ---------- bozza nel browser ---------- */
function saveDraft(){try{localStorage.setItem(DRAFT,JSON.stringify({date:$("date").value,note:$("note").value,values}))}catch(e){}}
function loadDraft(){
  try{const d=JSON.parse(localStorage.getItem(DRAFT));
    if(d&&d.values&&typeof d.values==="object"){values=d.values;$("date").value=d.date||today();$("note").value=d.note||"";
      Object.keys(values).forEach(k=>{if(!rowMap[k])delete values[k]});return}}catch(e){}
  $("date").value=today();
}

/* ---------- file ---------- */
function sortedRows(){
  return Object.entries(values).sort((a,b)=>(W[b[1].i||""]+W[b[1].f||""])-(W[a[1].i||""]+W[a[1].f||""])||a[0].localeCompare(b[0],"it")).map(([k,v])=>[k,v.i,v.f]);
}
function textFile(){
  const L=["EmotionQuest","Scheda 1: emozioni, sentimenti e stati d'animo relativi a questo periodo di vita","","Data: "+fmtDate($("date").value||today()),"","Emozione, intensità, frequenza"];
  const nt=$("note").value.trim();if(nt)L.splice(4,0,"Nota: "+nt);
  sortedRows().forEach(r=>L.push(`${r[0]}: intensità ${r[1]||"-"}, frequenza ${r[2]||"-"}`));
  return L.join("\n")+"\n";
}
async function deliver(name,blob){
  const file=new File([blob],name,{type:blob.type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast("File salvato nei download");
}
function ready(){
  if(!Object.keys(values).length){toast("Seleziona almeno un'emozione");return false}
  recordHistory();
  return true;
}
const FMT="treq_formato_v1";
let fmt="pdf",lastSave=0;
try{if(localStorage.getItem(FMT)==="txt")fmt="txt"}catch(e){}
function paintFmt(){document.querySelectorAll(".fmt button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===fmt)))}
document.querySelector(".fmt").addEventListener("click",ev=>{
  const b=ev.target.closest("button[data-f]");if(!b)return;
  fmt=b.dataset.f;try{localStorage.setItem(FMT,fmt)}catch(e){}paintFmt();
});
const fileDate=iso=>{const p=iso.split("-");return p[2]+"."+p[1]+"."+p[0]};
$("save").onclick=()=>{
  if(Date.now()-lastSave<1500)return;
  if(!ready())return;
  lastSave=Date.now();
  const date=$("date").value||today(),name="EQ_"+fileDate(date)+"."+fmt;
  if(fmt==="pdf"){
    const u=buildPdf({title:"EmotionQuest",subtitle:"Scheda 1: emozioni, sentimenti e stati d'animo relativi a questo periodo di vita",date:fmtDate(date),note:$("note").value.trim(),rows:sortedRows()});
    deliver(name,new Blob([u],{type:"application/pdf"}));
  }else{
    deliver(name,new Blob([textFile()],{type:"text/plain"}));
  }
};
function fresh(){
  const old=Object.keys(values);values={};$("note").value="";
  old.forEach(k=>{if(rowMap[k])paintRow(k)});
  refresh();saveDraft();
}
$("st").onclick=()=>openPanel("summary");
let prevDate="";
$("date").addEventListener("change",()=>{
  const nd=$("date").value;
  if(!nd){$("date").value=prevDate||today();return}
  if(nd!==prevDate&&(Object.keys(values).length||$("note").value.trim())){
    if(!confirm("Cambiando la data il questionario verrà azzerato: perderai le scelte e la nota di questa compilazione.\n\nSe ti servono, salva prima il PDF.\n\nVuoi continuare?")){$("date").value=prevDate;return}
    const snap={date:prevDate,note:$("note").value,values:JSON.parse(JSON.stringify(values))};
    fresh();setUndo(snap);showUndoBar();renderSummary();
  }
  prevDate=nd;saveDraft();
});
const PANELS=["freq","summary","searchBox"];
function openPanel(id){
  PANELS.forEach(p=>{$(p).hidden=p!==id;document.querySelector('.tab[data-p="'+p+'"]').setAttribute("aria-expanded",String(p===id))});
  if(id!=="searchBox"&&$("q").value){$("q").value="";refresh()}
  if(id==="searchBox")$("q").focus();
}
document.querySelector(".tabs").addEventListener("click",ev=>{
  const b=ev.target.closest(".tab");if(!b)return;
  openPanel(b.getAttribute("aria-expanded")==="true"?null:b.dataset.p);
});
$("q").addEventListener("keydown",ev=>{if(ev.key==="Escape")openPanel(null)});
$("q").addEventListener("input",refresh);
$("note").addEventListener("input",()=>{clearUndo();saveDraft()});
$("undoBtn").onclick=doUndo;

buildList();buildSheet();loadDraft();prevDate=$("date").value;if(Object.keys(values).length||$("note").value.trim())setUndo(null);else if(undoSnap&&(Object.keys(undoSnap.values||{}).length||(undoSnap.note||"").trim()))showUndoBar();Object.keys(values).forEach(paintRow);refresh();renderFreq();paintFmt();
try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
</body>
